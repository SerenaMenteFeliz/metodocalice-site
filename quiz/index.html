<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Descubra seu código instalado · Método Cálice</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Jost:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- As telas vêm deste arquivo (ver o script no fim): pré-carregar em paralelo com o resto do <head> -->
<link rel="preload" href="/quiz/variantes.json" as="fetch" crossorigin="anonymous" />
<style>
  /* Tokens reais do tema "Santuário + Véu" (Método Cálice) — ver
     .claude/skills/quiz-funnel-designer/references/visual-identity-serena.md */
  :root {
    --bg: #faf6fb;
    --veil-0: #fdfcfe;
    --veil-1: #faf6fb;
    --veil-2: #f7efe3;
    --ink: #453d57;
    --accent: #8a6d3e;
    --gold: #d9a854;
    --gold-soft: #e7c77a;
    --surface: #ffffff;
    --surface-dark-1: #2b1e42;
    --surface-dark-2: #4a2e63;
    --surface-dark-fg: #fbf6f0;
    --glass: rgba(255, 255, 255, .62);
    --glass-strong: rgba(255, 255, 255, .82);
    --glass-border: rgba(255, 255, 255, .9);
    --shadow-tint: rgba(155, 130, 200, .4);
    --lavender: #c9bbe8;
    --error: #b3453f;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-label: 'Jost', sans-serif;
    --font-ui: 'Manrope', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    color: var(--ink);
    background: linear-gradient(170deg, var(--veil-0) 0%, var(--veil-1) 55%, var(--veil-2) 100%);
    background-attachment: fixed;
    line-height: 1.55;
  }
  #app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* ---------- barra de progresso (fixa no topo; outline fica na trilha em si, não numa linha divisória) ---------- */
  .progress-shell {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 16px 20px 14px;
    background: linear-gradient(170deg, var(--veil-0) 0%, var(--veil-1) 100%);
    transition: opacity .2s ease;
  }
  /* escondida no hook (step 0) e nos cards de transição (pausas honestas + virada de
     esperança) — não fazem parte da contagem das 8 perguntas, a barra ali confundia */
  .progress-shell.is-hidden { opacity: 0; pointer-events: none; }
  /* trava a largura da trilha no mesmo max-width do conteúdo (.wrap) — em telas
     largas a barra esticada ponta-a-ponta perdia relação visual com o resto */
  .progress-inner { max-width: 480px; margin: 0 auto; }
  .progress-track {
    height: 6px; background: var(--glass); border: 1px solid var(--glass-border);
    border-bottom: 2px solid rgba(154, 130, 200, .38);
    border-radius: 999px; overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); transition: width .3s ease; }
  .progress-count { font-family: var(--font-label); font-size: 12px; letter-spacing: .03em; color: var(--accent); margin: 8px 2px 0; }

  /* ---------- footer legal (fluxo normal, não fixo — não é um menu) ---------- */
  /* fica no fim da página de verdade: em step curto, margin-top:auto + #app
     min-height:100vh empurra ele pro rodapé da tela; em step longo (ex:
     resultado), a página rola normalmente e o footer aparece só depois do
     conteúdo, nunca sobreposto a ele. Antes era position:fixed com gradiente
     que deixava o topo transparente — texto de step com rolagem longa ficava
     visível "por baixo" do footer durante o scroll (achado real, print do
     Yan 01/08). Corrigido tirando o fixed em vez de só opacificar o fundo:
     o Yan não queria uma barra fixa ali, só o footer normal no final. */
  .legal-footer {
    text-align: center; padding: 12px 20px 16px; margin-top: auto;
    font-family: var(--font-label); font-size: 11px; color: var(--ink); opacity: .6; letter-spacing: .01em;
  }
  .legal-footer a { color: inherit; text-decoration: underline; text-decoration-color: rgba(69,61,87,.35); }
  .legal-footer a:hover { text-decoration-color: currentColor; }

  /* ---------- zona de conteúdo: abaixo da barra fixa no topo ---------- */
  /* sem overflow-y:auto de propósito: quando o step cabe na tela, o flex:1
     mais o min-height:100vh do #app já centralizam sem precisar de scroll
     nenhum; quando não cabe (ex: resultado), a PÁGINA inteira rola — não
     mais um scroll interno escondido atrás de um footer fixo. */
  #steps { flex: 1; display: flex; flex-direction: column; padding-top: 60px; padding-bottom: 8px; }
  [data-step] { display: none; flex: 1; }
  [data-step].is-active { display: flex; }
  /* entrada: fade + leve subida. saída: só fade, mais rápido (a troca real de
     step só acontece depois que a saída termina — ver goToStep no JS) */
  [data-step].is-enter { animation: step-in .45s cubic-bezier(.16,1,.3,1); }
  [data-step].is-leaving { opacity: 0; transition: opacity .16s ease; }
  @keyframes step-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    [data-step].is-enter { animation: none; }
    [data-step].is-leaving { transition: none; }
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .eyebrow { font-family: var(--font-label); font-size: 13px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; }
  /* revelação parcial: mesma frase do resultado ("X, seu código instalado é:"), serifada
     itálica pra não ficar burocrático como as outras eyebrows (Processando, tags) */
  #revealEyebrow { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 18px; text-transform: none; letter-spacing: 0; }
  /* h1 = momento curto/emocional (abertura, nome do arquétipo) → serifada.
     h2 = frase longa que precisa ser lida rápido (pergunta, prompt de captura) → sans,
     mais peso, mais entrelinha. Serifada em frase comprida lê bonito mas lento — regra
     registrada em references/visual-identity-serena.md. */
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 31px; line-height: 1.22; margin: 0 0 14px; color: var(--ink); }
  h1 em { font-style: italic; color: var(--accent); }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.42; margin: 0 0 20px; }
  /* títulos das perguntas (steps de seleção): serifada ficou pesada/lenta pra leitura
     rápida de frase comprida — sans, mais peso, mais entrelinha, como a regra original
     de h2 já previa (ver comentário acima) */
  h2.q-title { font-family: var(--font-ui); font-weight: 700; font-size: 20px; line-height: 1.48; }
  /* nome/e-mail: serifada já no peso máximo carregado (700) — o stroke fino reforça
     a massa da letra sem trocar de fonte nem cair em negrito sintético */
  h2.cap-title { -webkit-text-stroke: .4px currentColor; }
  p.lead { font-family: var(--font-ui); font-size: 16px; color: var(--ink); opacity: .78; margin: 0 0 28px; }
  /* subheadline de dor (logo abaixo do h1) — mais peso pra não competir em silêncio com o h1 */
  p.lead.lead-strong { font-weight: 600; opacity: .94; }
  /* highlight pontual em texto corrido */
  .mark { font-weight: 700; color: var(--accent); }

  /* ---------- placeholder de imagem (explícito, nunca vazio/genérico) ---------- */
  .img-placeholder {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    width: 100%;
    border-radius: 22px;
    border: 1.5px dashed var(--lavender);
    background: var(--glass);
    color: var(--accent);
    text-align: center;
    padding: 18px;
    margin: 0 0 26px;
    overflow: hidden;
  }
  .img-placeholder .glow { position: absolute; inset: -30% -10% auto -10%; height: 140%; background: radial-gradient(circle, rgba(201,187,232,.5), transparent 65%); pointer-events: none; }
  .img-placeholder span.ico { font-size: 30px; }
  .img-placeholder small { font-family: var(--font-label); font-size: 12px; opacity: .75; max-width: 260px; }
  .img-hero { aspect-ratio: 3/4; max-width: 176px; margin: 0 auto 22px; }
  /* moldura pra mídia final (não placeholder) — mesmo espírito do dashed dos
     placeholders, mas em dourado: intencional/decorativo, não "provisório" */
  .media-frame {
    max-width: 176px;
    margin: 0 auto 22px;
    padding: 5px;
    border: 1.5px dashed var(--gold);
    border-radius: 24px;
  }
  .media-frame img { display: block; width: 100%; border-radius: 20px; }
  .img-badge, .result-orb { aspect-ratio: 3/4; }
  .img-badge img, .result-orb img { height: 100%; object-fit: cover; }
  .img-badge { max-width: 208px; margin: 0 auto 24px; }
  .img-cover { aspect-ratio: 3/4; max-width: 220px; margin: 0 auto 28px; }
  .img-envelope { aspect-ratio: 1/1; max-width: 140px; margin: 0 auto 22px; }

  /* ---------- pausas honestas / virada de esperança: bloco tipo citação, não texto solto ---------- */
  .bridge-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px 22px 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 14px 30px -20px var(--shadow-tint);
    margin: 0 0 22px;
  }
  .bridge-img { width: 148px; height: 148px; margin: 0 auto 20px; padding: 4px; border-radius: 9999px; }
  .bridge-img .ico { font-size: 56px; }
  .bridge-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 9999px; }
  .bridge-quote {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink);
    margin: 0;
  }

  /* ---------- loading do resultado: anel de progresso circular (0%→100% no centro) + frases ---------- */
  .loading-ring-wrap { position: relative; width: 128px; height: 128px; margin: 0 auto 22px; }
  .loading-ring { position: relative; width: 100%; height: 100%; transform: rotate(-90deg); }
  .loading-ring-track { fill: none; stroke: var(--glass); stroke-width: 8; }
  .loading-ring-fill {
    fill: none; stroke: url(#loadingRingGrad); stroke-width: 8; stroke-linecap: round;
    stroke-dasharray: 339.292; stroke-dashoffset: 339.292;
  }
  .loading-percent {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 34px; color: var(--ink);
  }
  .loading-phrase {
    font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 17px;
    color: var(--ink); opacity: .82;
    min-height: 24px; margin: 0 0 4px; transition: opacity .22s ease;
  }
  .loading-phrase.is-swapping { opacity: 0; }

  /* ---------- opções de quiz (glass card + emoji) ---------- */
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 15px 16px;
    margin-bottom: 11px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px -16px var(--shadow-tint);
    font-family: var(--font-ui);
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option:hover { border-color: var(--gold); background: var(--glass-strong); }
  .option:active { transform: scale(.98); }
  .option .emoji { font-size: 20px; flex: 0 0 auto; }
  /* ---------- botão primário (card de contraste, nunca preto genérico) ---------- */
  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    text-align: center;
    background: linear-gradient(160deg, var(--surface-dark-1), var(--surface-dark-2));
    color: var(--surface-dark-fg);
    font-family: var(--font-label);
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: .01em;
    border: 0;
    border-radius: 9999px;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
    box-shadow: 0 12px 26px -14px var(--shadow-tint);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 30px -14px var(--shadow-tint); }
  .btn:active { transform: translateY(0) scale(.99); }
  .btn-narrow { width: auto; min-width: 250px; max-width: 340px; margin: 0 auto; }
  .btn-pulse { animation: btn-pulse-soft 2.6s ease-in-out infinite; }
  .btn-pulse:hover { animation-play-state: paused; }
  @keyframes btn-pulse-soft { 0%, 100% { transform: scale(1); box-shadow: 0 12px 26px -14px var(--shadow-tint); } 50% { transform: scale(1.03); box-shadow: 0 16px 32px -14px var(--shadow-tint); } }

  /* ---------- captura ---------- */
  .field { margin-bottom: 16px; }
  .label { display: block; font-family: var(--font-label); font-size: 13.5px; font-weight: 600; margin-bottom: 7px; color: var(--ink); }
  .input {
    width: 100%;
    padding: 14px 15px;
    font-family: var(--font-ui);
    font-size: 16px;
    border: 1.5px solid var(--glass-border);
    background: var(--surface);
    border-radius: 13px;
    outline: none;
    box-sizing: border-box;
  }
  .input:focus { border-color: var(--gold); }
  .input.invalid { border-color: var(--error); background: #fdf3f2; }
  [data-email-msg] { display: none; font-family: var(--font-label); font-size: 12px; color: var(--error); margin-top: 7px; }
  [data-email-msg].show { display: block; }
  [data-email-suggestion] { display: none; font-family: var(--font-label); font-size: 13px; color: var(--ink); opacity: .75; margin-top: 8px; }
  [data-email-suggestion].show { display: block; }
  [data-email-suggestion] button { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--accent); text-decoration: underline; cursor: pointer; }
  .disclaimer { font-family: var(--font-label); font-size: 10.5px; color: var(--ink); opacity: .6; margin: -6px 0 18px; }

  /* ---------- loading ---------- */
  .center { text-align: center; }

  /* ---------- resultado ---------- */
  .result-orb {
    max-width: 152px; margin: 0 auto 20px;
    box-shadow: 0 14px 28px -18px var(--shadow-tint);
    animation: float-slow 7s ease-in-out infinite;
  }
  @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) { .result-orb { animation: none; } }
  .result-card {
    background: linear-gradient(160deg, rgba(43,30,66,.94), rgba(74,46,99,.88));
    color: var(--surface-dark-fg);
    border-radius: 20px;
    padding: 22px 22px 4px;
    margin-bottom: 22px;
    box-shadow: 0 20px 40px -22px var(--shadow-tint);
  }
  .result-tag { display: inline-block; font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 17px; color: var(--gold-soft); margin-bottom: 10px; }
  .result-lead { font-family: var(--font-ui); font-size: 15.5px; color: var(--surface-dark-fg); opacity: .85; margin: 0 0 4px; }
  .result-archetype { font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 27px; line-height: 1.25; color: var(--surface-dark-fg); margin: 0 0 16px; }
  .result-body p { margin: 0 0 16px; font-size: 15.5px; color: var(--surface-dark-fg); opacity: .92; }

  /* ---------- oferta: o paywall (18/09/2026) ----------
     Fica depois do card de resultado e usa a mesma família visual dele de
     propósito: o diagnóstico é o bloco escuro e fechado, a oferta é o bloco
     claro e aberto. A troca de fundo é o que marca "acabou o que você é,
     começou o que dá pra fazer". Sem color-mix, igual ao resto do arquivo:
     o tráfego aqui é celular frio e navegador velho custa venda. */
  .oferta-ponte { margin: 0 0 24px; }
  .oferta-ponte h2 { font-size: 22px; line-height: 1.3; margin: 0 0 12px; }
  .oferta-ponte p { margin: 0 0 12px; font-size: 15.5px; line-height: 1.6; }
  .oferta-card {
    background: var(--surface);
    border: 1px solid rgba(217, 168, 84, .45);
    border-radius: 20px;
    padding: 22px 20px 18px;
    box-shadow: 0 18px 36px -24px var(--shadow-tint);
  }
  .oferta-nome { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 25px; line-height: 1.2; margin: 0 0 6px; }
  .oferta-promessa { font-size: 15px; line-height: 1.55; margin: 0 0 18px; opacity: .82; }
  .oferta-inclusos { list-style: none; margin: 0 0 20px; padding: 0; }
  .oferta-inclusos li { position: relative; padding-left: 26px; margin-bottom: 11px; font-size: 14.5px; line-height: 1.45; }
  .oferta-inclusos li:last-child { margin-bottom: 0; }
  .oferta-inclusos li::before { content: '\2713'; position: absolute; left: 0; top: 0; color: var(--gold); font-weight: 700; }
  .oferta-preco { text-align: center; margin: 0 0 4px; font-family: var(--font-display); }
  .oferta-preco s { font-size: 19px; opacity: .42; }
  .oferta-preco b { font-size: 34px; font-weight: 700; font-style: italic; color: var(--accent); margin-left: 9px; }
  .oferta-selo { text-align: center; font-family: var(--font-label); font-size: 12.5px; letter-spacing: .03em; opacity: .58; margin: 0 0 18px; }
  .oferta-card .btn { width: 100%; }
  .oferta-card .disclaimer { text-align: center; margin-bottom: 0; }

  /* ---------- mobile-first: ajustes pra telas estreitas (iPhone SE/mini, ~360-390px) ---------- */
  @media (max-width: 380px) {
    .progress-shell { padding: 14px 16px 12px; }
    #steps { padding-top: 52px; padding-bottom: 6px; }
    .wrap { padding: 22px 16px 34px; }
    h1 { font-size: 26px; }
    h2 { font-size: 21px; }
    h2.q-title { font-size: 18px; }
    .img-hero { max-width: 148px; }
    .media-frame { max-width: 148px; }
    .btn { padding: 14px 18px; font-size: 15px; }
    .btn-narrow { min-width: 210px; }
    .bridge-card { padding: 24px 18px 20px; }
    .bridge-quote { font-size: 19px; }
    .bridge-img { width: 116px; height: 116px; }
    .loading-ring-wrap { width: 108px; height: 108px; }
    .img-badge { max-width: 160px; }
    .result-orb { max-width: 116px; }
    .oferta-nome { font-size: 22px; }
    .oferta-preco b { font-size: 30px; }
    .oferta-ponte h2 { font-size: 20px; }
  }
</style>
<script src="../assets/posthog-init.js"></script>
</head>
<body>
<div id="app">
  <div class="progress-shell is-hidden">
    <div class="progress-inner">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
  <div id="steps"></div>
  <footer class="legal-footer">Método Cálice · <a href="/privacidade">Política de Privacidade</a> · <a href="/termos">Termos de Uso</a></footer>
</div>

<script>
(function () {
  'use strict';

  // ---------- Onde mora o conteúdo (12/09/2026) ----------
  // As telas não moram mais aqui. Cada VARIANTE do quiz (V1, V2...) é um bloco
  // de dados em quiz/variantes.json, e este arquivo só desenha a variante
  // sorteada. O painel do zuppas-life lê o MESMO JSON pra montar a lista de
  // etapas e o preview, então editar o JSON atualiza o quiz e o painel juntos:
  // até esta data o painel tinha uma cópia à mão da ordem das telas, que
  // mentia em silêncio no dia em que uma tela entrasse ou saísse. Formato e
  // regras de edição no topo do próprio JSON ("_leia_antes").
  var URL_VARIANTES = '/quiz/variantes.json';
  var IMG = '../assets/img/';
  var CHAVE_VARIANTE = 'quiz_variante';
  var EM_PREVIEW = typeof IS_PREVIEW !== 'undefined' && IS_PREVIEW; // definido em assets/posthog-init.js

  // ---------- UTM (best-effort, captado uma vez na abertura) ----------
  // Roda antes de tudo, sem esperar as variantes: a URL com utm_* só existe na
  // chegada. Em 12/09/2026 este bloco ficou de fora da reescrita pra variantes, e
  // por um dia todo lead foi gravado como utm_content=direto, inclusive quem veio
  // da bio da Ge (a PostHog tinha o utm certo, o banco não). Achado em 13/09.
  (function captureUTM() {
    var q = new URLSearchParams(window.location.search);
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
      var v = q.get(k);
      if (v) localStorage.setItem('quiz_' + k, v);
    });
  })();

  var stepsEl = document.getElementById('steps');

  function el(html) {
    var d = document.createElement('div');
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }

  // Campo de texto puro do JSON. Os que aceitam HTML estão listados no
  // "_leia_antes" e entram sem passar por aqui.
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Nome como prefixo natural ("Bianca, você não está só nisso."), com a
  // primeira letra do texto em minúscula no encaixe. Sem nome, o texto puro.
  // Mesmo padrão de sempre em captura, revelação, pausas e perguntas 7 e 8.
  function comNome(texto) {
    var nome = localStorage.getItem('quiz_name') || '';
    return nome ? nome + ', ' + texto.charAt(0).toLowerCase() + texto.slice(1) : texto;
  }

  // ---------- Qual variante esta pessoa vê ----------
  // 1. ?v=<id> abre qualquer variante, inclusive rascunho (preview do painel,
  //    teste da família). Não grava: a URL já carrega a escolha no refresh.
  // 2. No preview sem ?v=, a primeira da lista.
  // 3. Quem já sorteou antes volta pra mesma, enquanto ela seguir ativa. Sem
  //    isso, quem fecha e volta no dia seguinte veria as duas e sujaria a
  //    comparação.
  // 4. Senão, sorteio pelo peso entre as ativas, guardado no navegador.
  // Sorteio local e instantâneo de propósito, e não feature flag da PostHog:
  // a flag chega pela rede depois da página, e a espera cairia na abertura,
  // que é a tela que mais perde gente.
  function escolherVariante(lista) {
    var pedida = new URLSearchParams(window.location.search).get('v');
    var i;
    for (i = 0; i < lista.length; i++) if (lista[i].id === pedida) return lista[i];
    if (EM_PREVIEW) return lista[0];

    var ativas = lista.filter(function (v) { return v.status === 'ativa' && v.peso > 0; });
    if (!ativas.length) return lista[0];

    var salva = localStorage.getItem(CHAVE_VARIANTE);
    for (i = 0; i < ativas.length; i++) if (ativas[i].id === salva) return ativas[i];

    var total = ativas.reduce(function (soma, v) { return soma + v.peso; }, 0);
    var sorteio = Math.random() * total;
    var escolhida = ativas[ativas.length - 1];
    for (i = 0; i < ativas.length; i++) {
      sorteio -= ativas[i].peso;
      if (sorteio < 0) { escolhida = ativas[i]; break; }
    }
    localStorage.setItem(CHAVE_VARIANTE, escolhida.id);
    return escolhida;
  }

  // ---------- Como cada tipo de tela vira HTML ----------
  var MONTAR = {
    abertura: function (t) {
      return '<div data-step>' +
        '<div class="wrap center">' +
          '<h1>' + t.titulo + '</h1>' +
          '<p class="lead lead-strong">' + t.subtitulo + '</p>' +
          '<div class="media-frame"><img src="' + IMG + esc(t.imagem) + '" alt="" /></div>' +
          '<p class="lead">' + t.texto + '</p>' +
          '<button type="button" class="btn btn-narrow btn-pulse" id="btnStart">' + esc(t.botao) + '</button>' +
        '</div>' +
      '</div>';
    },
    // Captura antecipada do nome (sem e-mail ainda), usado no resto do funil inteiro
    nome: function (t) {
      return '<div data-step>' +
        '<div class="wrap">' +
          '<h2 class="cap-title">' + esc(t.titulo) + '</h2>' +
          '<div class="field">' +
            '<input id="capNameEarly" class="input" type="text" placeholder="' + esc(t.placeholder) + '" autocomplete="given-name" />' +
          '</div>' +
          '<button type="button" class="btn" id="btnNameContinue">' + esc(t.botao) + '</button>' +
        '</div>' +
      '</div>';
    },
    pergunta: function (t) {
      var opts = t.opcoes.map(function (o) {
        return '<button type="button" class="option" data-archetype="' + esc(o.arquetipo) + '">' +
          '<span class="emoji">' + esc(o.emoji) + '</span><span>' + esc(o.texto) + '</span>' +
          '</button>';
      }).join('');
      return '<div data-step>' +
        '<div class="wrap">' +
          '<h2 class="q-title">' + esc(t.texto) + '</h2>' +
          '<div>' + opts + '</div>' +
        '</div>' +
      '</div>';
    },
    // Pausas honestas entre blocos de perguntas e virada de esperança: validam
    // o esforço de responder, não o conteúdo da resposta (a pontuação só fecha
    // na última pergunta; reagir a uma resposta isolada seria personalização
    // fabricada). Ver references/visual-identity-serena.md.
    pausa: function (t) {
      return '<div data-step data-bridge="' + esc(t.id) + '">' +
        '<div class="wrap center">' +
          '<div class="bridge-card">' +
            '<div class="media-frame bridge-img"><img src="' + IMG + esc(t.imagem) + '" alt="" /></div>' +
            '<p class="bridge-quote" data-bridge-quote>' + esc(t.texto) + '</p>' +
          '</div>' +
          '<button type="button" class="btn btn-bridge btn-narrow">' + esc(t.botao) + '</button>' +
        '</div>' +
      '</div>';
    },
    // Anel de progresso circular com % contando 0→100 no centro + frases
    // rotativas; o resultado só aparece na revelação seguinte
    calculando: function (t) {
      return '<div data-step>' +
        '<div class="wrap center">' +
          '<p class="eyebrow">' + esc(t.sobretitulo) + '</p>' +
          '<div class="loading-ring-wrap">' +
            '<svg class="loading-ring" viewBox="0 0 120 120">' +
              '<defs>' +
                '<linearGradient id="loadingRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
                  '<stop offset="0%" stop-color="var(--gold)" />' +
                  '<stop offset="100%" stop-color="var(--lavender)" />' +
                '</linearGradient>' +
              '</defs>' +
              '<circle class="loading-ring-track" cx="60" cy="60" r="54" />' +
              '<circle class="loading-ring-fill" id="loadingRingFill" cx="60" cy="60" r="54" />' +
            '</svg>' +
            '<span class="loading-percent" id="loadingPercent">0%</span>' +
          '</div>' +
          '<p class="loading-phrase" id="loadingPhrase">' + esc(t.frases[0]) + '</p>' +
        '</div>' +
      '</div>';
    },
    revelacao: function (t) {
      return '<div data-step>' +
        '<div class="wrap center">' +
          '<p class="eyebrow" id="revealEyebrow">' + esc(t.sobretitulo) + '</p>' +
          '<div class="media-frame result-orb"><img id="revealOrbImg" src="" alt="" /></div>' +
          '<h1 id="revealLabel"></h1>' +
          '<p class="lead">' + t.texto + '</p>' +
          '<button type="button" class="btn" id="btnToCapture">' + esc(t.botao) + '</button>' +
        '</div>' +
      '</div>';
    },
    // E-mail; o nome já foi coletado na abertura
    captura: function (t) {
      return '<div data-step>' +
        '<div class="wrap">' +
          '<div class="media-frame img-envelope"><img src="' + IMG + esc(t.imagem) + '" alt="" /></div>' +
          '<h2 id="captureHeading" class="cap-title">' + esc(t.titulo) + '</h2>' +
          '<form id="captureForm">' +
            '<div class="field">' +
              '<label class="label" for="capEmail">' + esc(t.rotuloCampo) + '</label>' +
              '<input id="capEmail" class="input" type="email" data-funnel-field="email" placeholder="' + esc(t.placeholder) + '" required autocomplete="email" inputmode="email" />' +
              '<div data-email-msg></div>' +
              '<div data-email-suggestion></div>' +
            '</div>' +
            '<p class="disclaimer">' + esc(t.aviso) + '</p>' +
            '<button type="submit" class="btn" id="btnCapture">' + esc(t.botao) + '</button>' +
          '</form>' +
        '</div>' +
      '</div>';
    },
    // O paywall do V2 (18/09/2026). O diagnóstico continua de graça e aparece
    // aqui inteiro, no mesmo card do `resultado`: o que está atrás do botão não
    // é o resultado, é o Método Cálice. Cobrar pelo resultado depois de o quiz
    // prometer "descubra o seu em 8 perguntas" seria trocar a regra no fim.
    oferta: function (t) {
      var p = t.produto;
      return '<div data-step>' +
        '<div class="wrap">' +
          '<div class="media-frame img-badge"><img id="ofertaBadgeImg" src="" alt="" /></div>' +
          '<div class="result-card">' +
            '<span class="result-tag">' + esc(t.sobretitulo) + '</span>' +
            '<h1 class="result-archetype" id="ofertaArchetype"></h1>' +
            '<div class="result-body" id="ofertaBody"></div>' +
          '</div>' +
          '<div class="oferta-ponte">' +
            '<h2>' + t.ponteTitulo + '</h2>' +
            '<p id="ofertaGancho"></p>' +
            '<p>' + t.ponteTexto + '</p>' +
          '</div>' +
          '<div class="oferta-card">' +
            '<p class="oferta-nome">' + esc(p.nome) + '</p>' +
            '<p class="oferta-promessa">' + esc(p.promessa) + '</p>' +
            '<ul class="oferta-inclusos">' +
              p.inclusos.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') +
            '</ul>' +
            '<p class="oferta-preco"><s>' + esc(p.precoDe) + '</s><b>' + esc(p.precoPor) + '</b></p>' +
            '<p class="oferta-selo">' + esc(p.selo) + '</p>' +
            '<a class="btn btn-pulse" id="btnOferta" href="#">' + esc(p.botao) + '</a>' +
            (p.garantia ? '<p class="disclaimer">' + esc(p.garantia) + '</p>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    },
    resultado: function (t) {
      return '<div data-step>' +
        '<div class="wrap">' +
          '<div class="media-frame img-badge"><img id="resultBadgeImg" src="" alt="" /></div>' +
          '<div class="result-card">' +
            '<span class="result-tag" id="resultTag">' + esc(t.sobretitulo) + '</span>' +
            '<h1 class="result-archetype" id="resultArchetype"></h1>' +
            '<div class="result-body" id="resultBody"></div>' +
          '</div>' +
          '<a class="btn" id="btnMaterial" href="#">' + esc(t.botao) + '</a>' +
        '</div>' +
      '</div>';
    }
  };

  // ---------- Carregar as variantes ----------
  // O quiz passou a depender de um arquivo do próprio domínio (pré-carregado
  // no <head>). Se ele falhar, tenta de novo e, na terceira, mostra uma saída
  // em vez de tela em branco.
  function carregar(tentativa) {
    fetch(URL_VARIANTES).then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }).then(function (dados) {
      if (!dados || !dados.variantes || !dados.variantes.length) throw new Error('variantes.json sem variantes');
      return dados;
    }).then(function (dados) {
      iniciar(escolherVariante(dados.variantes));
    }, function (err) {
      if (tentativa < 3) { setTimeout(function () { carregar(tentativa + 1); }, 700); return; }
      console.error('Não carregou as variantes do quiz:', err);
      phTrack('quiz_erro_carregamento', { erro: String((err && err.message) || err) });
      mostrarErro();
    });
  }

  function mostrarErro() {
    stepsEl.innerHTML =
      '<div data-step class="is-active">' +
        '<div class="wrap center">' +
          '<h2>Não consegui abrir o quiz agora.</h2>' +
          '<p class="lead">Confira sua conexão e tente de novo.</p>' +
          '<button type="button" class="btn btn-narrow" id="btnRecarregar">Tentar de novo</button>' +
        '</div>' +
      '</div>';
    document.getElementById('btnRecarregar').addEventListener('click', function () { window.location.reload(); });
  }

  carregar(1);

  // ---------- Runtime do funil (ver .claude/skills/quiz-funnel-designer/SKILL.md) ----------
  function iniciar(variante) {
    var telas = variante.telas;
    var resultados = variante.resultados;
    var arquetipos = Object.keys(resultados); // ordem do JSON = ordem de desempate
    var totalPerguntas = telas.filter(function (t) { return t.tipo === 'pergunta'; }).length;
    var telaPorId = {};
    var telaDoTipo = {};

    // Carimba a variante em todo evento desta pessoa daqui pra frente, inclusive
    // o material_viewed, que é outra página do mesmo domínio. É o que deixa o
    // painel separar as variantes. No preview a PostHog nem inicia.
    if (window.posthog && typeof posthog.register === 'function') {
      posthog.register({ quiz_variant: variante.id });
    }

    var steps = [];
    var nPergunta = 0;
    telas.forEach(function (tela) {
      if (!MONTAR[tela.tipo]) throw new Error('Tipo de tela desconhecido em ' + variante.id + ': ' + tela.tipo);
      if (telaPorId[tela.id]) throw new Error('id de tela repetido em ' + variante.id + ': ' + tela.id);
      telaPorId[tela.id] = tela;
      if (!telaDoTipo[tela.tipo]) telaDoTipo[tela.tipo] = tela;
      var node = el(MONTAR[tela.tipo](tela));
      node.dataset.id = tela.id;
      node.dataset.kind = tela.tipo;
      if (tela.tipo === 'pergunta') node.dataset.qindex = String(nPergunta++);
      stepsEl.appendChild(node);
      steps.push(node);
    });

    var idx = 0;

    // ?preview_step= (junto com ?preview=1, ver assets/posthog-init.js) pula
    // direto pra uma tela no load. Usado pelo /painel do zuppas-life pra
    // embutir a tela ao vivo num iframe. Aceita o id da tela (o painel usa
    // esse, que não muda quando outra tela entra antes) ou a posição (formato
    // antigo, até 12/09/2026).
    var isPreviewJump = false;
    (function jumpToPreviewStep() {
      var raw = new URLSearchParams(window.location.search).get('preview_step');
      if (raw === null) return;
      var n = -1;
      if (/^\d+$/.test(raw)) n = parseInt(raw, 10);
      else for (var i = 0; i < steps.length; i++) if (steps[i].dataset.id === raw) n = i;
      if (n < 0 || n >= steps.length) return;
      idx = n;
      isPreviewJump = true;
    })();

    // Um evento genérico com propriedades (em vez de um nome por tela). step_id
    // e quiz_variant desde 12/09/2026: com eles o painel conta por identidade
    // da tela, e não por posição, e uma tela nova não empurra as outras.
    function trackStepView(stepEl) {
      phTrack('quiz_step_viewed', {
        step_index: idx,
        step_id: stepEl.dataset.id,
        step_kind: stepEl.dataset.kind,
        question_index: stepEl.dataset.qindex != null ? Number(stepEl.dataset.qindex) + 1 : null,
        quiz_variant: variante.id
      });
    }

    function updateProgress() {
      // Barra de progresso reflete só as perguntas, não o funil inteiro. Some na
      // abertura, no resultado, nas pausas e no calculando.
      var current = steps[idx];
      var kind = current.dataset.kind;
      var fill = document.getElementById('progressFill');
      var shell = document.querySelector('.progress-shell');
      shell.classList.toggle('is-hidden', idx === 0 || idx === steps.length - 1 || kind === 'pausa' || kind === 'calculando');
      if (kind === 'pergunta') {
        var qi = Number(current.dataset.qindex);
        fill.style.width = (((qi + 1) / totalPerguntas) * 100) + '%';
      }
    }

    function render() {
      steps.forEach(function (s, i) {
        s.classList.toggle('is-active', i === idx);
        s.classList.toggle('is-enter', i === idx);
      });
      updateProgress();
      window.scrollTo(0, 0);
      trackStepView(steps[idx]);
    }

    // Transição entre steps: fade-out do step atual, só então troca e faz
    // fade-in do próximo. Sem isso a troca de `display:none` corta seco,
    // não dá pra animar uma propriedade que já sumiu.
    var TRANSITION_MS = 160;
    function goToStep(newIdx) {
      var current = steps[idx];
      current.classList.remove('is-enter');
      current.classList.add('is-leaving');
      setTimeout(function () {
        current.classList.remove('is-active', 'is-leaving');
        idx = newIdx;
        var next = steps[idx];
        next.classList.add('is-active', 'is-enter');
        updateProgress();
        window.scrollTo(0, 0);
        trackStepView(next);
        afterRender();
      }, TRANSITION_MS);
    }

    window.__funnel = {
      variante: variante.id,
      get currentStep() { return idx + 1; },
      get totalSteps() { return steps.length; },
      continue: function () { if (idx < steps.length - 1) goToStep(idx + 1); },
      back: function () { if (idx > 0) goToStep(idx - 1); }
    };

    // Texto que depende do nome, preenchido ao entrar na tela (o nome só existe
    // depois da 2ª tela). Pausas com usaNome, perguntas com ecoaNome (no V1, só
    // a 7 e a 8, pra não virar mala-direta) e o título da captura. As pausas
    // sem nome existem de propósito: 4 telas seguidas usando o nome soou
    // repetitivo.
    function personalizar(stepEl) {
      var tela = telaPorId[stepEl.dataset.id];
      if (tela.tipo === 'pausa') {
        stepEl.querySelector('[data-bridge-quote]').textContent = tela.usaNome ? comNome(tela.texto) : tela.texto;
      }
      if (tela.tipo === 'pergunta' && tela.ecoaNome) {
        stepEl.querySelector('h2').textContent = comNome(tela.texto);
      }
      if (tela.tipo === 'captura') {
        document.getElementById('captureHeading').textContent = comNome(tela.titulo);
      }
    }

    function afterRender() {
      var current = steps[idx];
      if (current.dataset.kind === 'calculando') runLoading(telaPorId[current.dataset.id]);
      // Evento próprio, além do `quiz_step_viewed` genérico: é a etapa de
      // "chegou na oferta" do funil do V2, e carrega o arquétipo pra dar pra ler
      // conversão por arquétipo sem cruzar tabela.
      if (current.dataset.kind === 'oferta') {
        phTrack('offer_viewed', {
          archetype: localStorage.getItem('quiz_result') || null,
          quiz_variant: variante.id
        });
      }
      personalizar(current);
    }

    // Preview ao vivo (ver jumpToPreviewStep acima): revelação e resultado só
    // ganham conteúdo através do cálculo no fim do quiz de verdade. Popular as
    // duas com um resultado evita que apareçam vazias quando abertas
    // direto. A tela de calculando fica com o markup estático: não roda a
    // animação, que levaria pra outra tela sozinha.
    if (isPreviewJump) {
      var previewResult = computeResult();
      populateReveal(previewResult);
      populateResult(previewResult);
      populateOferta(previewResult);
      personalizar(steps[idx]);
    }

    render();

    // ---------- Lógica de cada tela ----------

    var btnStart = document.getElementById('btnStart');
    if (btnStart) {
      btnStart.addEventListener('click', function () {
        phTrack('quiz_started');
        window.__funnel.continue();
      });
    }

    // Nome antecipado: campo único, sem e-mail, usado no resto do funil inteiro
    (function setupNameEarly() {
      var input = document.getElementById('capNameEarly');
      var btn = document.getElementById('btnNameContinue');
      if (!input || !btn) return;
      input.addEventListener('input', function () { input.style.borderColor = ''; });
      btn.addEventListener('click', function () {
        var val = input.value.trim();
        if (!val) { input.style.borderColor = 'var(--error)'; input.focus(); return; }
        localStorage.setItem('quiz_name', val);
        window.__funnel.continue();
      });
    })();

    // Pausas e virada de esperança: mesmo botão genérico, delegação de clique
    stepsEl.addEventListener('click', function (e) {
      var bridgeBtn = e.target.closest('.btn-bridge');
      if (bridgeBtn) window.__funnel.continue();
    });

    // Perguntas: clique na opção grava resposta e avança
    stepsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.option');
      if (!btn) return;
      var stepEl = btn.closest('[data-step]');
      var qi = Number(stepEl.dataset.qindex);
      localStorage.setItem('quiz_answer_' + (qi + 1), btn.dataset.archetype);
      phTrack('quiz_question_answered', { question: qi + 1, archetype: btn.dataset.archetype });
      window.__funnel.continue();
    });

    function computeResult() {
      var score = {};
      arquetipos.forEach(function (a) { score[a] = 0; });
      var firstSeenAt = {};
      for (var i = 1; i <= totalPerguntas; i++) {
        var a = localStorage.getItem('quiz_answer_' + i);
        if (!a || !(a in score)) continue;
        score[a]++;
        if (!(a in firstSeenAt)) firstSeenAt[a] = i;
      }
      var winner = null, best = -1;
      arquetipos.forEach(function (arch) {
        if (score[arch] > best) { best = score[arch]; winner = arch; }
        else if (score[arch] === best) {
          // empate: vence quem apareceu primeiro entre as respostas
          if (firstSeenAt[arch] < firstSeenAt[winner]) winner = arch;
        }
      });
      localStorage.setItem('quiz_result', winner);
      phTrack('quiz_completed', { result: winner });
      return winner;
    }

    function runLoading(tela) {
      var RING_CIRC = 339.292; // 2 * PI * r(54)
      var DURATION = tela.duracaoMs || 3100; // mesma duração do ciclo inteiro (frases + cálculo)
      var ringFill = document.getElementById('loadingRingFill');
      var percentEl = document.getElementById('loadingPercent');
      ringFill.style.strokeDashoffset = RING_CIRC;
      percentEl.textContent = '0%';

      var startTs = null;
      function tick(ts) {
        if (startTs === null) startTs = ts;
        var pct = Math.min(100, Math.round(((ts - startTs) / DURATION) * 100));
        percentEl.textContent = pct + '%';
        ringFill.style.strokeDashoffset = RING_CIRC * (1 - pct / 100);
        if (pct < 100) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      var phraseEl = document.getElementById('loadingPhrase');
      var phrases = tela.frases;

      function swapPhrase(text) {
        phraseEl.classList.add('is-swapping');
        setTimeout(function () {
          phraseEl.textContent = text;
          phraseEl.classList.remove('is-swapping');
        }, 220);
      }

      phraseEl.textContent = phrases[0];
      var pi = 1;
      var phraseTimer = setInterval(function () {
        if (pi >= phrases.length) { clearInterval(phraseTimer); return; }
        swapPhrase(phrases[pi]);
        pi++;
      }, 750);

      setTimeout(function () {
        clearInterval(phraseTimer);
        var result = computeResult();
        swapPhrase(tela.final);
        percentEl.textContent = '100%';
        ringFill.style.strokeDashoffset = 0;
        populateReveal(result);
        populateResult(result);
        populateOferta(result);
        setTimeout(function () { window.__funnel.continue(); }, 900);
      }, DURATION);
    }

    function populateReveal(result) {
      var tela = telaDoTipo.revelacao;
      if (!tela) return;
      document.getElementById('revealEyebrow').textContent = comNome(tela.sobretitulo);
      document.getElementById('revealOrbImg').src = IMG + resultados[result].img;
      document.getElementById('revealLabel').textContent = resultados[result].label;
    }

    function populateResult(result) {
      if (!telaDoTipo.resultado) return;
      document.getElementById('resultBadgeImg').src = IMG + resultados[result].img;
      document.getElementById('resultArchetype').textContent = resultados[result].label;
      var body = document.getElementById('resultBody');
      body.innerHTML = resultados[result].corpo.map(function (p) { return '<p>' + p + '</p>'; }).join('');
      document.getElementById('btnMaterial').href = '/material?r=' + result;
    }

    // O paywall. Recebe o mesmo corpo do resultado (o diagnóstico é grátis) e
    // mais o gancho daquele arquétipo, que é a única frase da oferta que muda
    // por pessoa: a dor do Aprovador não é a do Controlador, e uma oferta que
    // fala das duas não fala de nenhuma.
    function populateOferta(result) {
      var tela = telaDoTipo.oferta;
      if (!tela) return;
      var r = resultados[result];
      document.getElementById('ofertaBadgeImg').src = IMG + r.img;
      document.getElementById('ofertaArchetype').textContent = r.label;
      document.getElementById('ofertaBody').innerHTML =
        r.corpo.map(function (par) { return '<p>' + par + '</p>'; }).join('');
      document.getElementById('ofertaGancho').textContent = r.ofertaGancho || '';
      document.getElementById('btnOferta').href = urlCheckout(tela.produto.url, result);
    }

    // O checkout mora em OUTRO domínio (serena-app), então nada do localStorage
    // do quiz atravessa sozinho: arquétipo, variante e UTM vão na URL ou não
    // chegam. Mesmo motivo do `?cid=` nos e-mails, ver o conceito de identidade
    // de analytics no vault.
    function urlCheckout(base, result) {
      var q = new URLSearchParams();
      q.set('r', result);
      q.set('v', variante.id);
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
        var v = localStorage.getItem('quiz_' + k);
        if (v) q.set(k, v);
      });
      return base + (base.indexOf('?') >= 0 ? '&' : '?') + q.toString();
    }

    // Sair daqui é sair do domínio, então o clique é o último evento que a gente
    // vê desta pessoa. `offer_cta_clicked` é a etapa que fecha o funil do V2, que
    // não tem `lead_submitted` nenhum pra contar.
    (function setupOferta() {
      var btn = document.getElementById('btnOferta');
      if (!btn) return;
      btn.addEventListener('click', function () {
        phTrack('offer_cta_clicked', {
          archetype: localStorage.getItem('quiz_result') || null,
          quiz_variant: variante.id
        });
      });
    })();

    var btnToCapture = document.getElementById('btnToCapture');
    if (btnToCapture) {
      btnToCapture.addEventListener('click', function () {
        window.__funnel.continue();
      });
    }

    setupCapture(variante);
  }

  // Captura: valida e-mail (formato + descartável + sugestão de typo), grava lead, envia pro backend
  function setupCapture(variante) {
    var EMAIL_RE = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
    var DISPOSABLE = {
      'mailinator.com':1,'guerrillamail.com':1,'guerrillamail.info':1,'guerrillamail.net':1,
      'sharklasers.com':1,'grr.la':1,'10minutemail.com':1,'10minutemail.net':1,'tempmail.com':1,
      'temp-mail.org':1,'tempmail.net':1,'throwawaymail.com':1,'yopmail.com':1,'yopmail.fr':1,
      'trashmail.com':1,'trashmail.net':1,'getnada.com':1,'maildrop.cc':1,'dispostable.com':1,
      'fakeinbox.com':1,'mailnesia.com':1,'mintemail.com':1,'mailcatch.com':1,'mohmal.com':1,
      'emailondeck.com':1,'spam4.me':1,'tempinbox.com':1,'moakt.com':1,'mailto.plus':1,
      '1secmail.com':1,'discard.email':1,'harakirimail.com':1,'tempr.email':1,'getairmail.com':1,
      'nada.email':1,'fakemail.net':1,'fakemailgenerator.com':1,'maileater.com':1,'inboxbear.com':1,
      'tmail.com':1,'mytemp.email':1,'burnermail.io':1,'33mail.com':1,'einrot.com':1
    };
    var POPULAR = [
      'gmail.com','hotmail.com','outlook.com','yahoo.com','yahoo.com.br','icloud.com',
      'live.com','bol.com.br','uol.com.br','terra.com.br','globo.com','ig.com.br',
      'msn.com','proton.me','protonmail.com'
    ];

    function levenshtein(a, b) {
      var m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      var prev = [], cur = [], i, j;
      for (j = 0; j <= n; j++) prev[j] = j;
      for (i = 1; i <= m; i++) {
        cur[0] = i;
        for (j = 1; j <= n; j++) {
          var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        }
        for (j = 0; j <= n; j++) prev[j] = cur[j];
      }
      return cur[n];
    }
    function suggest(email) {
      var at = email.lastIndexOf('@');
      if (at < 1) return null;
      var local = email.slice(0, at);
      var domain = email.slice(at + 1).toLowerCase();
      if (!domain || POPULAR.indexOf(domain) !== -1) return null;
      var best = null, bestDist = 99;
      for (var k = 0; k < POPULAR.length; k++) {
        var d = levenshtein(domain, POPULAR[k]);
        if (d < bestDist) { bestDist = d; best = POPULAR[k]; }
      }
      if (best && bestDist > 0 && bestDist <= 2) return local + '@' + best;
      return null;
    }
    function classify(email) {
      if (!EMAIL_RE.test(email)) return { type: 'format' };
      var domain = email.slice(email.lastIndexOf('@') + 1).toLowerCase();
      if (DISPOSABLE[domain]) return { type: 'disposable' };
      var fix = suggest(email);
      if (fix) return { type: 'typo', suggestion: fix };
      return { type: 'ok' };
    }

    var form = document.getElementById('captureForm');
    if (!form) return; // variante sem tela de captura
    var emailInput = document.getElementById('capEmail');
    var msg = document.querySelector('[data-email-msg]');
    var sug = document.querySelector('[data-email-suggestion]');
    var validated = false;
    var lastTypoVal = null;
    var sending = false;

    function showError(text) {
      emailInput.classList.add('invalid');
      msg.textContent = text; msg.classList.add('show');
      sug.classList.remove('show'); sug.innerHTML = '';
    }
    function clearMsgs() {
      emailInput.classList.remove('invalid');
      msg.classList.remove('show'); msg.textContent = '';
      sug.classList.remove('show'); sug.innerHTML = '';
    }
    function showSuggestion(fixed) {
      emailInput.classList.remove('invalid');
      msg.classList.remove('show');
      sug.innerHTML = 'Você quis dizer <button type="button">' + fixed + '</button>?';
      sug.classList.add('show');
      sug.querySelector('button').addEventListener('click', function () {
        emailInput.value = fixed; lastTypoVal = null; clearMsgs(); emailInput.focus();
      });
    }

    emailInput.addEventListener('input', function () {
      validated = false;
      clearMsgs();
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (sending) return;

      var name = localStorage.getItem('quiz_name') || '';
      var value = (emailInput.value || '').trim().toLowerCase();
      emailInput.value = value;

      if (!validated) {
        var r = classify(value);
        if (r.type === 'format') { showError('Digite um e-mail válido.'); return; }
        if (r.type === 'disposable') { showError('Use seu e-mail principal: caixas temporárias não recebem o material.'); return; }
        if (r.type === 'typo' && value !== lastTypoVal) { showSuggestion(r.suggestion); lastTypoVal = value; return; }
        validated = true;
      }

      clearMsgs();
      localStorage.setItem('quiz_email', value);

      sending = true;
      var btn = document.getElementById('btnCapture');
      btn.textContent = 'Enviando...';

      var result = localStorage.getItem('quiz_result');
      fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          email: value,
          result: result,
          quiz_variant: variante.id,
          event_type: 'isca',
          offer: 'quiz-diagnostico',
          product: 'metodo-calice',
          utm_source: localStorage.getItem('quiz_utm_source') || '',
          utm_medium: localStorage.getItem('quiz_utm_medium') || '',
          utm_campaign: localStorage.getItem('quiz_utm_campaign') || '',
          utm_content: localStorage.getItem('quiz_utm_content') || 'direto'
        })
      }).then(function (resp) {
        // A tela segue pro resultado mesmo com erro (fire-and-forget), então sem
        // este evento um lead perdido não deixa rastro nenhum: em 13/09/2026 dois
        // se perderam e só apareceram cruzando contacts com lead_events à mão.
        // Pega também o caso em que a função é encerrada no meio (502/504), em
        // que o servidor não chega a registrar nada.
        if (!resp.ok) {
          phTrack('lead_erro_envio', { status: resp.status, quiz_variant: variante.id });
          return null; // 502/504 da Vercel vem em HTML: não tentar ler como JSON
        }
        return resp.json();
      }).then(function (data) {
        // Identifica pelo contact_id (contacts.id do Supabase), não pelo
        // e-mail — mesma convenção de identidade que o serena-app usa
        // (Track.tsx, lib/analytics/server.ts). Funde os eventos anônimos
        // do funil (quiz_started, quiz_step_viewed...) nesse perfil, e é o
        // mesmo id que vai continuar sendo usado quando essa pessoa logar
        // no app e comprar — sem isso, quiz e app virariam duas pessoas
        // diferentes na PostHog.
        if (data && data.contact_id) {
          if (window.posthog && typeof posthog.identify === 'function') {
            posthog.identify(data.contact_id);
          }
          // Carimba o cid no link do material (mesmo se essa pessoa nunca
          // clicar agora e só voltar via e-mail dias depois com um cookie
          // diferente) — ver identify() em material/index.html, achado 04/08.
          var btnMaterial = document.getElementById('btnMaterial');
          if (btnMaterial && btnMaterial.href) {
            btnMaterial.href += (btnMaterial.href.indexOf('?') === -1 ? '?' : '&') + 'cid=' + encodeURIComponent(data.contact_id);
          }
        }
      }).catch(function (err) {
        // fire-and-forget: não bloqueia a experiência se a rede falhar — o lead
        // ainda vê o resultado; o e-mail de reforço fica pendente até reenviar depois.
        console.error('Erro ao enviar o lead:', err);
        phTrack('lead_erro_envio', { status: 'rede', erro: String((err && err.message) || err).slice(0, 200), quiz_variant: variante.id });
      });

      window.__funnel.continue();
    });
  }
})();
</script>
